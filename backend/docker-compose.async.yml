services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  celery-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.worker
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/backend:/workspace/backend/packages
      APP_ASYNC_PROVIDER: celery
      APP_CELERY_BROKER_URL: redis://redis:6379/0
      APP_CELERY_RESULT_BACKEND: redis://redis:6379/0
      APP_CELERY_QUEUE: authoring
      APP_CELERY_INDEXING_QUEUE: knowledge-indexing
      APP_CELERY_RETRIEVAL_QUEUE: retrieval
      APP_DB_DSN: ${APP_WORKER_DB_DSN:-postgresql://app:app@host.docker.internal:55432/langgraph}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspace
    working_dir: /workspace/backend
    command: >
      bash -lc "celery -A apps.worker.celery_app:celery_app worker --loglevel=INFO --queues=authoring,knowledge-indexing,retrieval"
