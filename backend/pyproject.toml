[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-document-ai-backend"
version = "0.1.0"
description = "Backend skeleton for LangGraph document AI platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=1.1,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]