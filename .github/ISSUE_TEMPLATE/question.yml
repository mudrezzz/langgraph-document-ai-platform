name: Question
description: Ask a usage or integration question.
title: "question: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Please include context so we can answer quickly.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you building?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What did you try?
      description: Commands, docs pages, or snippets.
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: Where are you blocked?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What answer or outcome do you need?
    validations:
      required: true
